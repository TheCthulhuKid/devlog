[project]
name = "devlog"
version = "0.1.0"
description = "Turns a week of git history, GitHub activity and notes into an engineering journal entry, each claim linked to its evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Marc", email = "gileadslostson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.13.0",
    "pydantic>=2.14.4",
]

[project.urls]
Repository = "https://github.com/TheCthulhuKid/devlog"

[project.scripts]
devlog = "devlog.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=devlog --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
