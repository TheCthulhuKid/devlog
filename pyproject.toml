[project]
name = "devlog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marc", email = "gileadslostson@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
devlog = "devlog:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=devlog --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
